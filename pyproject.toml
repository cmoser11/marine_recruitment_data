[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine_recruitment_data"
version = "0.1.0"
description = "ASVAB outcome analysis for Marine Corps recruiting data"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "scipy",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
mrd = "marine_recruitment_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marine_recruitment_data = ["data/*.csv"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
